# Runs the tests, then stages the release on npm when a GitHub release is created.
# Nothing goes live from CI: a maintainer approves the staged version with 2FA on
# npmjs.com (or `npm stage approve <id>`). See https://docs.npmjs.com/staged-publishing
#
# Auth: npm trusted publishing (OIDC) once it is configured on npmjs.com (package
# Settings > Trusted Publisher > GitHub Actions: owner ksparakis, repository
# serverless-plugin-split-stacks-by-group, workflow npm-publish.yml, staged only).
# npm then hands the run a short-lived credential and the NPM_TOKEN secret below can
# be deleted. Until then the secret is used; staging needs no 2FA, only approving does.

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the npm CLI request the OIDC token trusted publishing exchanges.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Staged publishing needs Node >= 22.14 and npm >= 11.15.
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
